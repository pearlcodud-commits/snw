<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SUPER NUMBER WORLD : THE PRICE ADVENTURE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff7ac0; --pink2:#ffb3dc; --lav:#a98bff; --lav2:#d6c8ff; --sky:#5cc8ff; --sky2:#b5e6ff;
  --mint:#3fe0b0; --mint2:#b4f7e1; --yel:#ffd84d; --yel2:#fff1a8; --ink:#3a2770; --ink2:#6b5aa6;
  --glass:rgba(255,255,255,.55); --glass2:rgba(255,255,255,.78);
  --good:#2fd39a; --bad:#ff7d9c;
  --r:28px;
  --font:'Baloo 2','Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);touch-action:manipulation}
body{background:#f6e9ff}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
.ko{font-family:'Jua',var(--font)}

/* ---------- world background ---------- */
#bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(1200px 700px at 10% 0%,#ffd6f0 0%,transparent 60%),
  radial-gradient(900px 700px at 100% 10%,#c9e9ff 0%,transparent 60%),
  radial-gradient(900px 800px at 50% 110%,#c8fff0 0%,transparent 60%),
  linear-gradient(160deg,#fbe3ff,#e3e6ff 50%,#dcfbf3);transition:background .6s}
#bg .tw{position:absolute;font-size:22px;opacity:.7;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.3}50%{transform:scale(1.1) rotate(20deg);opacity:.95}}
body.calm #bg .tw{animation:none;opacity:.35}

#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column}

/* ---------- HUD ---------- */
#hud{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));flex:0 0 auto;z-index:5}
.pill{display:flex;align-items:center;gap:6px;background:var(--glass2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:2px solid rgba(255,255,255,.9);border-radius:999px;padding:4px 14px 4px 6px;font-weight:800;font-size:22px;box-shadow:0 6px 18px rgba(120,80,200,.15);white-space:nowrap}
.pill .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:linear-gradient(145deg,#fff,#ffe9a6)}
.pill.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25)}60%{transform:scale(.95)}}
.prog{width:120px;height:14px;border-radius:9px;background:rgba(160,130,255,.2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--sky),var(--lav));border-radius:9px;transition:width .8s}
#hud .sp{flex:1}
.hudbtn{width:52px;height:52px;border-radius:50%;background:var(--glass2);border:2px solid #fff;font-size:26px;box-shadow:0 6px 16px rgba(120,80,200,.18)}
#hudNumi{display:flex;align-items:center;gap:4px}
#hudNumi svg{width:44px;height:44px}

/* ---------- screens ---------- */
#stage{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:scrIn .45s cubic-bezier(.2,1.3,.4,1)}
body.calm .screen{animation:fadeIn .3s}
@keyframes scrIn{from{opacity:0;transform:scale(.94) translateY(20px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.mhead{display:flex;align-items:center;gap:12px;padding:4px 16px 8px}
.mhead h2{margin:0;font-size:34px;font-weight:800;letter-spacing:1px;flex:1;text-align:center;
  background:linear-gradient(90deg,var(--pink),var(--lav),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #fff)}
.mbody{flex:1;min-height:0;position:relative;padding:0 18px 18px;display:flex;flex-direction:column}

/* ---------- buttons ---------- */
.btn{--c1:#ff9bd2;--c2:#ff6fb5;--sh:#d94b92;position:relative;border-radius:999px;padding:12px 26px;font-size:26px;font-weight:800;color:#fff;
  background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 7px 0 var(--sh),0 12px 22px rgba(90,40,160,.25),inset 0 3px 0 rgba(255,255,255,.5);
  text-shadow:0 2px 0 rgba(0,0,0,.12);transition:transform .08s,box-shadow .08s;min-height:64px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--sh),0 6px 12px rgba(90,40,160,.2),inset 0 3px 0 rgba(255,255,255,.5)}
.btn.lav{--c1:#c3aeff;--c2:#9d7dff;--sh:#7254d6}
.btn.sky{--c1:#9be0ff;--c2:#4ebcff;--sh:#2b8fd1}
.btn.mint{--c1:#8ff5d2;--c2:#33d6a3;--sh:#1ea57c}
.btn.yel{--c1:#ffe98a;--c2:#ffc93d;--sh:#d99c12;color:#6b4a00;text-shadow:none}
.btn.white{--c1:#fff;--c2:#f3eeff;--sh:#cfc3f2;color:var(--ink);text-shadow:none}
.btn.sm{font-size:20px;padding:8px 18px;min-height:52px}
.btn.big{font-size:32px;padding:16px 36px;min-height:80px}
.btn[disabled]{filter:grayscale(.7);opacity:.6;pointer-events:none}
.round{width:64px;height:64px;padding:0;border-radius:50%;font-size:30px}
.boing{animation:boing .45s}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.15,.85)}55%{transform:scale(.92,1.08)}80%{transform:scale(1.03,.97)}100%{transform:scale(1)}}
body.calm .boing{animation:none}

/* ---------- glass card ---------- */
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:3px solid rgba(255,255,255,.85);border-radius:var(--r);box-shadow:0 14px 40px rgba(110,70,200,.18)}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:6px 16px;border-radius:999px;font-size:19px;font-weight:800;background:rgba(255,255,255,.6);border:3px solid #fff;box-shadow:0 4px 0 rgba(150,120,220,.35);min-height:52px}
.tab.on{background:linear-gradient(180deg,#fff7a8,#ffd84d);box-shadow:0 4px 0 #d9a514;transform:translateY(-2px)}
.inst{font-size:26px;font-weight:800;text-align:center;margin:4px 0 10px}
.inst .ko{font-size:22px;color:var(--ink2);font-weight:400;display:block}
.safe>:first-child{margin-top:auto!important}.safe>:last-child{margin-bottom:auto!important}
.center{display:flex;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column;align-items:center}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.grow{flex:1;min-height:0}

/* ---------- number typography ---------- */
.bignum{font-size:min(17vh,150px);font-weight:800;line-height:1;letter-spacing:2px;text-shadow:0 6px 0 #fff,0 12px 30px rgba(120,70,220,.3)}
.bignum .d{display:inline-block;animation:numPop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes numPop{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
body.calm .bignum .d{animation:fadeIn .3s both}
.d.th{color:#ff5fae}.d.h{color:#8c6bff}.d.r{color:#29a8f0}.d.cm{color:#b9a8e8}
.words{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.w{font-size:34px;font-weight:800;padding:6px 16px;border-radius:18px;background:rgba(255,255,255,.75);border:3px solid #fff;box-shadow:0 5px 0 rgba(150,120,220,.3);text-transform:uppercase;transition:all .15s}
.w.hl{background:linear-gradient(180deg,#fff59a,#ffd23f);transform:scale(1.15) translateY(-4px);box-shadow:0 8px 0 #e3a90f,0 0 30px #ffe680}
.tag{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#fffef0,#fff3b8);border:3px solid #ffd84d;border-radius:14px;padding:2px 12px;font-weight:800;font-size:24px;box-shadow:0 4px 0 #e5b623;color:#6b4a00;position:relative}
.tag:before{content:'';width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #e5b623;margin-right:2px}

/* choice cards */
.choices{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));width:100%}
.ch{color:var(--ink);background:linear-gradient(180deg,#fff,#f2ecff);border:4px solid #fff;border-radius:24px;padding:14px;font-size:30px;font-weight:800;box-shadow:0 7px 0 #c9b9f5,0 12px 24px rgba(110,70,200,.15);min-height:84px;transition:transform .1s}
.ch:active{transform:translateY(4px);box-shadow:0 3px 0 #c9b9f5}
.ch.wd{font-size:24px;text-transform:uppercase;line-height:1.15}
.ch.ok{background:linear-gradient(180deg,#d4ffef,#8ff0cb);box-shadow:0 7px 0 #2fbf8a;animation:boing .5s}
.ch.no{background:linear-gradient(180deg,#ffe1ea,#ffb5c8);box-shadow:0 7px 0 #e8799a}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px) rotate(-2deg)}40%{transform:translateX(9px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

/* ---------- main map ---------- */
.map{flex:1;display:grid;grid-template-columns:1fr 1fr minmax(260px,1.15fr) 1fr 1fr;grid-template-rows:auto 1fr 1fr;gap:16px;padding:0 22px 22px;min-height:0}
.title{grid-column:1/-1;text-align:center;font-size:min(8.2vh,64px);font-weight:800;margin:0;line-height:1;letter-spacing:2px;
  background:linear-gradient(90deg,#ff5fae,#a079ff,#3fb8ff,#30d9a4,#ffbf1f);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #fff) drop-shadow(0 10px 18px rgba(130,80,230,.35));animation:titleFloat 4s ease-in-out infinite}
.title small{display:block;font-size:.36em;letter-spacing:6px}
@keyframes titleFloat{50%{transform:translateY(-6px)}}
body.calm .title{animation:none}
.tile{position:relative;border-radius:34px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;
  background:linear-gradient(160deg,var(--t1),var(--t2));border:4px solid rgba(255,255,255,.9);box-shadow:0 10px 0 var(--t3),0 18px 30px rgba(90,50,180,.25),inset 0 4px 0 rgba(255,255,255,.6);transition:transform .1s;min-height:0}
.tile:active{transform:translateY(6px) scale(.98);box-shadow:0 4px 0 var(--t3)}
.tile .em{font-size:min(9vh,72px);filter:drop-shadow(0 8px 6px rgba(0,0,0,.18));animation:floaty 3s ease-in-out infinite}
.tile:nth-child(odd) .em{animation-delay:-1.5s}
@keyframes floaty{50%{transform:translateY(-8px) rotate(4deg)}}
body.calm .tile .em{animation:none}
.tile b{font-size:min(3.3vh,1.8vw,25px);font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18),0 0 10px rgba(0,0,0,.08);letter-spacing:.5px;text-align:center;line-height:1}
.tile span{font-size:min(2.5vh,18px);color:rgba(255,255,255,.95);font-family:'Jua'}
.tile:after{content:'';position:absolute;top:-30%;left:-20%;width:60%;height:80%;background:radial-gradient(closest-side,rgba(255,255,255,.55),transparent);transform:rotate(-20deg)}
.tile .no{position:absolute;top:8px;left:12px;font-weight:800;color:rgba(255,255,255,.9);font-size:18px}
.mapNumi{grid-column:3;grid-row:2/4;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.bubble{background:#fff;border-radius:26px;padding:12px 20px;font-size:22px;font-weight:800;box-shadow:0 8px 20px rgba(110,70,200,.2);position:relative;text-align:center;max-width:320px}
.bubble:after{content:'';position:absolute;bottom:-14px;left:50%;margin-left:-14px;border:14px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble .ko{display:block;font-size:18px;color:var(--ink2);font-weight:400}
.numiWrap{position:relative;animation:numiBob 2.6s ease-in-out infinite}
@keyframes numiBob{50%{transform:translateY(-12px)}}
body.calm .numiWrap{animation:none}
.numiWrap .acc{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none}
.platform{width:200px;height:40px;border-radius:50%;background:radial-gradient(closest-side,rgba(140,100,255,.35),transparent);margin-top:-14px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(60,30,120,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#modal.show{display:flex}
.mbox{background:linear-gradient(180deg,#fff,#f6f0ff);border-radius:40px;border:5px solid #fff;padding:26px 34px;min-width:min(560px,92vw);max-width:94vw;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 30px 80px rgba(70,30,150,.4);animation:scrIn .45s cubic-bezier(.2,1.4,.4,1)}
.mbox h3{margin:0 0 8px;font-size:40px;font-weight:800;color:var(--pink)}
.stars3{font-size:70px;letter-spacing:8px}
.stars3 i{font-style:normal;display:inline-block;animation:numPop .6s cubic-bezier(.2,1.8,.4,1) both}
.stars3 i.off{filter:grayscale(1) opacity(.3)}
.set{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 6px;border-bottom:2px dashed #e5dcff;font-size:24px;font-weight:800}
.sw{width:86px;height:46px;border-radius:30px;background:#ddd;position:relative;transition:.2s}
.sw:after{content:'';position:absolute;top:5px;left:5px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.2s}
.sw.on{background:linear-gradient(90deg,var(--mint),var(--sky))}.sw.on:after{left:45px}
input[type=range]{width:240px;accent-color:#a079ff;height:30px}
select{font-family:inherit;font-size:18px;padding:8px;border-radius:14px;border:2px solid #d8cbff;max-width:300px}

/* ---------- particles ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.pt{position:absolute;left:0;top:0;font-size:28px;will-change:transform}
.dot{position:absolute;width:12px;height:12px;border-radius:3px}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:90;font-size:44px;font-weight:800;color:#fff;padding:10px 34px;border-radius:999px;
  background:linear-gradient(90deg,#ff7ac0,#a98bff);box-shadow:0 10px 30px rgba(120,60,220,.4);animation:toast 1.4s forwards;pointer-events:none;white-space:nowrap}
.toast.bad{background:linear-gradient(90deg,#ffa8bf,#ffc59b)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}

/* ---------- LISTENING ---------- */
.th-listen #bg,.bg-listen{background:radial-gradient(800px 500px at 80% 10%,#6d4bd8 0%,transparent 60%),radial-gradient(700px 600px at 0% 100%,#d9479a 0%,transparent 60%),linear-gradient(180deg,#24135e,#3d1f86 60%,#5a2a9a)!important}
.dark{color:#fff}
.dark .mhead h2{background:linear-gradient(90deg,#ffd6f0,#d6c8ff,#b5e6ff);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 12px rgba(255,180,255,.6))}
.dark .inst .ko{color:#e3d9ff}
.panel .inst .ko,.desk .inst .ko,.glass .inst .ko,.lcard .ko{color:var(--ink2)!important}
.desk{color:var(--ink)}
.mhead h2 .e{color:#000;-webkit-text-fill-color:#000;filter:none}
.planet{position:absolute;border-radius:50%;pointer-events:none}
.lcard{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;border-radius:40px;
  background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(240,232,255,.9));border:5px solid #fff;color:var(--ink);box-shadow:0 0 0 8px rgba(255,255,255,.12),0 30px 70px rgba(0,0,0,.35);min-height:0;position:relative;overflow:hidden}
.lcard.flip{animation:flipIn .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes flipIn{0%{transform:perspective(900px) rotateY(80deg);opacity:0}100%{transform:none;opacity:1}}
.pv{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.pvb{border-radius:22px;padding:8px 18px;text-align:center;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.15);animation:numPop .5s cubic-bezier(.2,1.6,.4,1) both;cursor:pointer}
.pvb b{display:block;font-size:34px;line-height:1.1}
.pvb small{display:block;font-size:20px;font-weight:800;text-transform:uppercase;opacity:.95}
.c-th{background:linear-gradient(160deg,#ff9bd2,#ff5fae)}.c-h{background:linear-gradient(160deg,#c3aeff,#8c6bff)}.c-r{background:linear-gradient(160deg,#9be0ff,#29a8f0)}
.pvb{transition:transform .2s,box-shadow .2s}
.pvb.hl{transform:scale(1.12) translateY(-4px);box-shadow:0 0 0 5px #fff,0 0 34px #ffe680}
.op{font-size:40px;font-weight:800;color:#b49ae8;animation:numPop .5s both}
.deckbar{display:flex;flex-direction:column;gap:10px;width:190px;flex:0 0 auto}
.deck{border-radius:22px;padding:10px;font-size:20px;font-weight:800;background:rgba(255,255,255,.12);color:#fff;border:3px solid rgba(255,255,255,.35);text-align:left;line-height:1.1}
.deck small{display:block;font-size:15px;opacity:.85;font-family:'Jua';font-weight:400}
.deck.on{background:linear-gradient(160deg,#ffe98a,#ffbf1f);color:#5a3d00;border-color:#fff;box-shadow:0 0 24px rgba(255,220,100,.6)}
.navb{position:absolute;top:50%;transform:translateY(-50%);z-index:3}

/* ---------- LAB ---------- */
.bg-lab{background:linear-gradient(rgba(255,255,255,.35) 2px,transparent 2px) 0 0/40px 40px,linear-gradient(90deg,rgba(255,255,255,.35) 2px,transparent 2px) 0 0/40px 40px,linear-gradient(160deg,#c8fff0,#b5e6ff 60%,#d6c8ff)!important}
.blk{position:relative;border-radius:22px;padding:12px 22px;font-size:34px;font-weight:800;color:#fff;touch-action:none;cursor:grab;
  box-shadow:0 8px 0 rgba(0,0,0,.18),inset 0 4px 0 rgba(255,255,255,.45),0 14px 24px rgba(60,40,140,.2);text-shadow:0 2px 0 rgba(0,0,0,.15);min-width:120px;text-align:center;z-index:2}
.blk.dragging{z-index:60;transform:scale(1.1);cursor:grabbing;box-shadow:0 20px 40px rgba(60,40,140,.35)}
.machine{border-radius:40px;border:5px dashed #a98bff;background:rgba(255,255,255,.55);min-height:150px;min-width:420px;display:flex;align-items:center;justify-content:center;gap:12px;padding:16px;position:relative}
.machine.hot{background:rgba(255,248,200,.8);border-color:#ffbf1f}
.pvcols{display:flex;gap:14px;justify-content:center;align-items:flex-end}
.pvc{width:130px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pvc .stack{height:min(19vh,170px);width:110px;border-radius:20px;background:rgba(255,255,255,.55);border:3px solid #fff;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;padding:6px;overflow:hidden}
.pvc .stack i{display:block;width:90px;height:min(1.5vh,14px);flex:0 0 auto;border-radius:6px;animation:numPop .3s both}
.pvc .lb{font-size:18px;font-weight:800;background:#fff;border-radius:12px;padding:2px 10px}
.pvc .dg{font-size:36px;font-weight:800;line-height:1}
.popb{width:170px;height:120px;border-radius:30px;font-size:36px;font-weight:800;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.18),inset 0 4px 0 rgba(255,255,255,.5)}
.popb.gone{animation:popGone .35s forwards}
@keyframes popGone{60%{transform:scale(1.3);opacity:.7}100%{transform:scale(0);opacity:0}}

/* ---------- SPELLING ---------- */
.bg-spell{background:repeating-linear-gradient(180deg,transparent 0 46px,rgba(169,139,255,.18) 46px 48px),linear-gradient(160deg,#fff4fb,#efe8ff 60%,#e4f6ff)!important}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;flex:1;align-items:stretch}
.lvl{border-radius:34px;padding:14px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 10px 0 rgba(0,0,0,.15),0 18px 30px rgba(90,50,180,.2);border:4px solid #fff}
.lvl b{font-size:30px}.lvl .em{font-size:60px}.lvl span{font-family:'Jua';font-size:19px;text-align:center}
.typed{min-height:86px;font-size:44px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:8px 22px;border-radius:24px;background:#fff;border:4px solid #d6c8ff;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;max-width:1000px}
.typed .cur{display:inline-block;width:4px;height:46px;background:var(--pink);margin-left:3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.typed .L{display:inline-block;animation:letterShine .5s both}
@keyframes letterShine{0%{transform:scale(.3) translateY(10px);color:#ffd84d}60%{transform:scale(1.4);color:#ff5fae;text-shadow:0 0 18px #ffe680}100%{transform:none}}

<script>
'use strict';
/* =========================================================
   SUPER NUMBER WORLD — core engine
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => n.toLocaleString('en-US');

/* ---------- number → English ---------- */
const ONES = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function u100(n) { if (n < 20) return [ONES[n]]; const t = TENS[Math.floor(n / 10)], o = n % 10; return [o ? t + '-' + ONES[o] : t]; }
function u1000(n) { const w = []; const h = Math.floor(n / 100), r = n % 100; if (h) w.push(ONES[h], 'hundred'); if (r) w.push(...u100(r)); return w; }
function words(n) { if (n === 0) return ['zero']; const th = Math.floor(n / 1000), r = n % 1000, w = []; if (th) w.push(...u1000(th), 'thousand'); if (r) w.push(...u1000(r)); return w; }
const W = n => words(n).join(' ');
const WU = n => W(n).toUpperCase();
function chunks(n) {
  const out = [], th = Math.floor(n / 1000), h = Math.floor((n % 1000) / 100), r = n % 100;
  if (th) out.push({ val: th * 1000, w: [...u1000(th), 'thousand'], cls: 'c-th' });
  if (h) out.push({ val: h * 100, w: [ONES[h], 'hundred'], cls: 'c-h' });
  if (r) out.push({ val: r, w: u100(r), cls: 'c-r' });
  return out;
}
/* coloured digits: thousands part pink, hundreds lavender, rest sky */
function numHTML(n) {
  const s = fmt(n); let out = '', digitsLeft = String(n).length, i = 0;
  for (const ch of s) {
    if (ch === ',') { out += `<span class="d cm" style="animation-delay:${i * 60}ms">,</span>`; i++; continue; }
    const cls = digitsLeft > 3 ? 'th' : digitsLeft === 3 ? 'h' : 'r';
    out += `<span class="d ${cls}" style="animation-delay:${i * 60}ms">${ch}</span>`; digitsLeft--; i++;
  }
  return out;
}
/* flexible spoken / typed English → number */
const FIX = { for: 'four', fore: 'four', to: 'two', too: 'two', ate: 'eight', won: 'one', tree: 'three', free: 'three', fife: 'five', sex: 'six', tin: 'ten', hundreds: 'hundred', thousands: 'thousand', fourty: 'forty', nighty: 'ninety', eighty: 'eighty', fiveteen: 'fifteen', handred: 'hundred', housand: 'thousand', tousand: 'thousand', sousand: 'thousand' };
function parseEnglish(t) {
  if (!t) return null;
  t = String(t).toLowerCase().replace(/(\d),(\d)/g, '$1$2').replace(/-/g, ' ').replace(/[^a-z0-9 ]/g, ' ');
  let total = 0, cur = 0, any = false;
  for (let tk of t.split(/\s+/).filter(Boolean)) {
    tk = FIX[tk] || tk; let v;
    if (/^\d+$/.test(tk)) { cur += +tk; any = true; }
    else if ((v = ONES.indexOf(tk)) >= 0) { cur += v; any = true; }
    else if ((v = TENS.indexOf(tk)) >= 2) { cur += v * 10; any = true; }
    else if (tk === 'hundred') { cur = (cur || 1) * 100; any = true; }
    else if (tk === 'thousand') { total += (cur || 1) * 1000; cur = 0; any = true; }
  }
  return any ? total + cur : null;
}
const normWords = s => String(s).toLowerCase().replace(/-/g, ' ').replace(/\band\b/g, ' ').replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();

/* ---------- number pools ---------- */
function randNum(d) {
  d = d || S.diff; const r = Math.random();
  if (d === 1) return r < .3 ? rnd(1, 9) * 100 : r < .55 ? rnd(1, 9) * 1000 : rnd(1, 9) * 1000 + rnd(1, 9) * 100;
  if (d === 2) return r < .12 ? rnd(1, 9) * 100 : r < .3 ? rnd(1, 9) * 1000 : r < .6 ? rnd(1, 9) * 1000 + rnd(1, 9) * 100 : rnd(10, 99) * 1000 + (Math.random() < .5 ? 0 : rnd(1, 9) * 100);
  return r < .2 ? rnd(1, 9) * 1000 + rnd(1, 9) * 100 : r < .45 ? rnd(10, 99) * 1000 + rnd(0, 9) * 100 : rnd(100, 99999);
}
function nums(k, d) { const s = new Set(); while (s.size < k) s.add(randNum(d)); return [...s]; }
/* tricky look-alike distractors (5,800 → 5,080 / 8,500 / 580 / 58,000 …) */
function similar(n, k) {
  const c = new Set(), s = String(n);
  [n * 10, n / 10, n + 1000, n - 1000, n + 100, n - 100, n * 10 + 0].forEach(x => c.add(x));
  if (s.length >= 2) { const a = s.split(''); [a[0], a[1]] = [a[1], a[0]]; c.add(+a.join('')); }
  const th = Math.floor(n / 1000), h = Math.floor(n % 1000 / 100);
  if (th && h && th < 10) { c.add(th * 1000 + h * 10); c.add(h * 1000 + th * 100); c.add(th * 100 + h * 10); }
  if (th && !h && th < 10) { c.add(th * 100); c.add(th * 10000); }
  if (!th && h) { c.add(h * 1000); c.add(h * 10); }
  let arr = shuffle([...c].filter(x => Number.isInteger(x) && x >= 100 && x <= 99999 && x !== n));

  return arr.slice(0, k);

const STAGES = [[1, 'Baby NUMI', '아기 누미'], [3, 'Junior NUMI', '꼬마 누미'], [6, 'Star NUMI', '별빛 누미'], [10, 'Super NUMI', '슈퍼 누미']];

/* ---------- learning decks ---------- */
const DECKS = [
  { id: 'h', name: '100 – 900', ko: '백의 자리', list: Array.from({ length: 9 }, (_, i) => (i + 1) * 100) },
  { id: 't', name: '1,000 – 9,000', ko: '천의 자리', list: Array.from({ length: 9 }, (_, i) => (i + 1) * 1000) },

  { id: 'tt', name: '10,000 – 99,999', ko: '만 단위', list: [10000, 12000, 15000, 20000, 25000, 25800, 30000, 33000, 40500, 48000, 50000, 56700, 60000, 64300, 70000, 72500, 80000, 85000, 90000, 99000, 11111, 23456, 45321, 67890, 99999] }
];

/* ---------- daily missions ---------- */

let AC = null;

  const b = c.createBuffer(1, c.sampleRate * d, c.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
  const s = c.createBufferSource(); s.buffer = b; const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const g = c.createGain(); g.gain.value = vol; s.connect(f).connect(g).connect(c.destination); s.start(t);
}

/* =========================================================
   VOICE — Web Speech API (en-US)
   ========================================================= */
let VOICES = [], lastSay = null;
const PREF = ['Samantha', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Microsoft Ava', 'Ava', 'Allison', 'Nicky', 'Microsoft Guy', 'Alex', 'Microsoft Zira'];
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  const all = speechSynthesis.getVoices();
  VOICES = all.filter(v => /^en[-_]US/i.test(v.lang));
  if (!VOICES.length) VOICES = all.filter(v => /^en/i.test(v.lang));
}
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function chooseVoice() {
  if (!VOICES.length) loadVoices();
  if (S.voiceName) { const v = VOICES.find(v => v.name === S.voiceName); if (v) return v; }
  const nat = VOICES.find(v => /natural|premium|enhanced/i.test(v.name)); if (nat) return nat;
  for (const p of PREF) { const v = VOICES.find(v => v.name.includes(p)); if (v) return v; }
  return VOICES[0] || null;
}
/* speak(text, {rate, chips:[elements per word], onend}) — highlights each word chip while speaking */
let hlTimer = null;
function speak(text, o = {}) {
  lastSay = { text, o };
  if (!S.voice || !('speechSynthesis' in window)) { o.onend && setTimeout(o.onend, 300); return; }
  speechSynthesis.cancel(); clearInterval(hlTimer);
  const chips = o.chips || [];
  chips.forEach(c => c.classList.remove('hl'));
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; const v = chooseVoice(); if (v) u.voice = v;
  u.rate = (o.rate || 1) * S.rate; u.pitch = 1.05;

  const toks = [...text.matchAll(/\S+/g)].map(m => m.index);
  const off = toks.length - chips.length; let gotBoundary = false;
  const mark = i => { chips.forEach((c, j) => c.classList.toggle('hl', j === i)); };
  u.onboundary = e => {
    if (e.name && e.name !== 'word') return; gotBoundary = true;
    let wi = 0; toks.forEach((p, i) => { if (p <= e.charIndex) wi = i; });
    if (wi - off >= 0) mark(wi - off);
  };
  u.onstart = () => {
    if (!chips.length) return;
    setTimeout(() => {
      if (gotBoundary) return; // fallback timing
      const ws = text.split(/\s+/); const per = ws.map(w => (w.length + 3) * 62 / u.rate);
      let i = 0, t0 = Date.now(), acc = 0; const starts = per.map(p => (acc += p) - p);
      hlTimer = setInterval(() => { const el = Date.now() - t0 + 250; while (i < starts.length - 1 && starts[i + 1] <= el) i++; if (i - off >= 0) mark(i - off); if (el > acc + 400) clearInterval(hlTimer); }, 60);
    }, 250);
  };
  u.onend = () => { clearInterval(hlTimer); setTimeout(() => mark(-1), 250); o.onend && o.onend(); };
  u.onerror = () => { clearInterval(hlTimer); mark(-1); };

}

/* =========================================================
   drag helper (pointer events — touch + mouse)
   ========================================================= */
function draggable(node, { onDrop, onStart, targets }) {
  node.style.touchAction = 'none';
  node.addEventListener('pointerdown', e => {
    if (node.dataset.lock) return; e.preventDefault(); ac();
    const sx = e.clientX, sy = e.clientY; let moved = false; node.setPointerCapture(e.pointerId);
    node.classList.add('dragging'); onStart && onStart(node); SFX.pop();
    const mv = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy; if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
      node.style.transform = `translate(${dx}px,${dy}px) scale(1.1)`;
      (targets ? targets() : []).forEach(t => { const r = t.getBoundingClientRect(); t.classList.toggle('hot', ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom); });
    };
    const up = ev => {
      node.removeEventListener('pointermove', mv); node.removeEventListener('pointerup', up); node.removeEventListener('pointercancel', up);
      node.classList.remove('dragging');
      let hit = null; (targets ? targets() : []).forEach(t => { const r = t.getBoundingClientRect(); if (ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom) hit = t; t.classList.remove('hot'); });
      const back = () => { node.animate([{ transform: node.style.transform }, { transform: 'none' }], { duration: 280, easing: 'cubic-bezier(.2,1.5,.4,1)' }); node.style.transform = ''; };
      if (onDrop(node, hit, moved) === false) back(); else node.style.transform = '';
    };
    node.addEventListener('pointermove', mv); node.addEventListener('pointerup', up); node.addEventListener('pointercancel', up);
  });
}

/* shared mixed-question generator (used by Quick Quest + Boss) */
function makeQ(type) {
  const n = randNum();
  type = type || pick(['listen', 'read', 'word', 'missing']);
  if (type === 'listen') return { n, say: W(n), html: `<div class="inst" style="font-size:36px">🎧 Listen!<span class="ko">듣고 맞는 숫자를 골라요</span></div>`, ch: shuffle([n, ...similar(n, 3)]).map(v => ({ label: fmt(v), ok: v === n, big: 1 })) };
  if (type === 'read') return { n, html: `<div class="inst">How do you say it?<span class="ko">숫자를 영어로 어떻게 읽나요?</span></div><div class="bignum" style="font-size:100px">${numHTML(n)}</div>`, ch: shuffle([n, ...similar(n, 2)]).map(v => ({ label: WU(v), ok: v === n })) };
  if (type === 'word') return { n, html: `<div class="inst">Which number is it?<span class="ko">영어를 읽고 숫자를 골라요</span></div><div class="words">${words(n).map(w => `<span class="w">${w}</span>`).join('')}</div>`, ch: shuffle([n, ...similar(n, 3)]).map(v => ({ label: fmt(v), ok: v === n, big: 1 })) };
  const ws = words(n), gi = ws.length - 1, ans = ws[gi];
  const pool = ['hundred', 'thousand'].includes(ans) ? ['hundred', 'thousand'] : shuffle(ONES.slice(1, 10).filter(w => w !== ans)).slice(0, 2).concat(ans);
  return { n, html: `<div class="inst">Missing word!<span class="ko">빈칸에 들어갈 단어는?</span></div><div class="bignum" style="font-size:90px">${numHTML(n)}</div><div class="words">${ws.map((w, i) => `<span class="w">${i === gi ? '_____' : w}</span>`).join('')}</div>`, ch: shuffle(pool).map(w => ({ label: w.toUpperCase(), ok: w === ans })) };
}
function askQ(host, q, onRight, onWrong) {
  host.innerHTML = q.html; const ch = el(`<div class="choices" style="max-width:1000px;margin-top:10px"></div>`); host.appendChild(ch);
  let lock = false;
  q.ch.forEach(c => {
    const b = el(`<button class="ch ${c.big ? '' : 'wd'}" style="${c.big ? 'font-size:44px' : ''}">${c.label}</button>`);
    b.onclick = () => { if (lock) return; if (c.ok) { lock = true; b.classList.add('ok'); speak(W(q.n)); onRight(b); } else { b.classList.add('no'); oops(b, q.n); onWrong && onWrong(b); } };
    ch.appendChild(b);
  });
  if (q.say) speak(q.say);
}

/* 3. WORD PUZZLE — drag word pieces into slots */
function gPuzzle(c) {
  const a = c.area; a.classList.add('panel');
  const round = () => {
    const n = randNum(), ws = words(n);
    a.innerHTML = `<div class="inst" style="margin:0">Build the words! 🧩<span class="ko">단어 조각을 끌어서 빈칸에 순서대로 넣어요</span></div><div class="col"><div class="bignum" style="font-size:100px">${numHTML(n)}</div></div>`;
    const slots = el(`<div class="slots">${ws.map(() => '<div class="slot"></div>').join('')}</div>`); a.appendChild(slots);
    const tray = el(`<div class="row" style="margin-top:24px;gap:18px"></div>`); a.appendChild(tray);
    const pieces = shuffle(ws.map((w, i) => ({ w, i })));
    const sl = $$('.slot', slots); let filled = 0;
    const place = (node, s) => { s.textContent = node.w; s.classList.add('fill'); s.dataset.f = 1; node.remove(); SFX.bounce(); speak(node.w); filled++; if (filled === ws.length) { good(slots); c.later(() => speak(W(n)), 500); if (!c.step()) c.later(round, 2400); } };
    pieces.forEach((p, k) => {
      const b = el(`<div class="blk" style="background:${['linear-gradient(160deg,#ff9bd2,#ff5fae)', 'linear-gradient(160deg,#c3aeff,#8c6bff)', 'linear-gradient(160deg,#9be0ff,#29a8f0)', 'linear-gradient(160deg,#8ff5d2,#22c493)'][k % 4]};text-transform:uppercase;font-size:30px;clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%,8% 50%);padding:14px 40px">${p.w}</div>`);
      b.w = p.w; tray.appendChild(b);
      draggable(b, {
        targets: () => sl.filter(s => !s.dataset.f),
        onDrop: (node, hit, moved) => {
          const nextSlot = sl.find(s => !s.dataset.f), want = ws[sl.indexOf(nextSlot)];
          const target = hit || (!moved ? sl.find(s => !s.dataset.f && ws[sl.indexOf(s)] === node.w) || nextSlot : null); if (!target) return false;
          if (!target.dataset.f && ws[sl.indexOf(target)] === node.w) { place(node, target); return true; }
          c.no(node, null); speak(`Next is ${want}`); return false;

    });
    speak(W(n));
  };
  round();
}

    a.innerHTML = `<div class="inst" style="margin:0">🔍 One price tag is WRONG!<span class="ko">영어 이름표와 숫자 가격표가 다른 상품을 찾아요</span></div>`;
    const g = el(`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;flex:1;padding:8px"></div>`); a.appendChild(g);
    const fix = el(`<div class="col" style="min-height:120px"></div>`); a.appendChild(fix);
    let found = false;
    items.forEach((it, k) => {
      const shown = k === bad ? wrong : ps[k];
      const b = el(`<button class="ch" style="display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:center"><span style="font-size:70px">${it.e}</span><span class="hint" style="font-size:17px;text-transform:uppercase;line-height:1.1">${W(ps[k])}</span><span class="tag">${fmt(shown)}</span></button>`);
      b.onclick = () => {
        if (found) return;
        if (k === bad) {
          found = true; b.classList.add('no'); SFX.sparkle(); speak(`Yes! This tag is wrong. It should be ${W(ps[k])}.`);
          fix.innerHTML = `<div class="inst" style="margin:0">Fix it! 🛠️<span class="ko">올바른 가격표를 골라요</span></div>`;
          const ch = el(`<div class="row"></div>`); fix.appendChild(ch);
          shuffle([ps[k], wrong, similar(ps[k], 2).find(x => x !== wrong)]).forEach(v => {
            const t = el(`<button class="tag" style="font-size:40px;padding:8px 24px">${fmt(v)}</button>`);
            t.onclick = () => { if (v === ps[k]) { $('.tag', b).textContent = fmt(v); b.classList.remove('no'); b.classList.add('ok'); good(b, 2); fix.innerHTML = ''; if (!c.step()) c.later(round, 2000); } else { c.no(t, ps[k]); } };
            ch.appendChild(t);
          });
        } else { c.no(b, null); speak(`This one is OK. ${W(ps[k])}.`); }
      };
      g.appendChild(b);
    });
  };
  round();
}

/* 10. NUMBER FACTORY — press machines to drop place-value blocks */
function gFactory(c) {
  const a = c.area; a.classList.add('panel');
  const round = () => {
    const places = S.diff >= 3 ? [10000, 1000, 100, 10, 1] : S.diff === 2 ? [10000, 1000, 100] : [1000, 100];
    let n; do { n = randNum(); } while (n >= places[0] * 10 || (S.diff < 3 && n % 100));
    const made = [];
    a.innerHTML = `<div class="inst" style="margin:0">🏭 ORDER: <b style="text-transform:uppercase;color:#ff5fae">${W(n)}</b><span class="ko">기계 버튼을 눌러 블록을 만들고 📦 상자에 담아 보내요</span></div>`;
    const mach = el(`<div class="row"></div>`); a.appendChild(mach);
    const conv = el(`<div class="conv" style="margin:12px 0"></div>`); a.appendChild(conv);
    const info = el(`<div class="row"><span class="hint" style="font-size:26px" id="cnt">0</span><button class="btn white sm" id="un">⏪ UNDO</button><button class="btn sky sm" id="h">🔊</button><button class="btn mint big" id="ship">📦 SHIP IT!</button></div>`); a.appendChild(info);
    const sum = () => made.reduce((x, y) => x + y, 0);
    const size = v => v >= 10000 ? [70, 70] : v >= 1000 ? [52, 52] : v >= 100 ? [52, 16] : v >= 10 ? [10, 40] : [12, 12];
    const draw = () => { conv.innerHTML = ''; made.forEach(v => { const [w, h] = size(v); conv.appendChild(el(`<i class="cube" style="width:${w}px;height:${h}px;background:${blkColor(v)}"></i>`)); }); $('#cnt', info).textContent = `지금: ${fmt(sum())}`; };
    places.forEach(p => { const b = el(`<button class="btn" style="background:${blkColor(p)};box-shadow:0 7px 0 rgba(0,0,0,.25)">⚙️ +${fmt(p)}</button>`); b.onclick = () => { if (made.filter(x => x === p).length >= 9) return toast('9개까지만!', true); made.push(p); made.sort((x, y) => y - x); SFX.bounce(); draw(); }; mach.appendChild(b); });
    $('#un', info).onclick = () => { made.pop(); draw(); };
    $('#h', info).onclick = () => speak(W(n));
    $('#ship', info).onclick = () => {
      if (sum() === n) { SFX.register(); good(conv, 2); speak(`${W(n)}! Shipped!`); conv.animate([{ transform: 'none' }, { transform: 'translateX(120%)' }], { duration: 900, fill: 'forwards' }); if (!c.step()) c.later(round, 2000); }
      else c.no(conv, n, `You made ${W(sum() || 0)}. The order is ${W(n)}.`);
    };
    draw(); speak(W(n));
  };
  round();
}

/* 11. SPIN THE WHEEL */
function gWheel(c) {
  const a = c.area; a.classList.add('panel');
  a.innerHTML = '';
  const wrap = el(`<div class="row grow" style="gap:30px;flex-wrap:nowrap"></div>`); a.appendChild(wrap);
  const wheel = el(`<div class="wheel"><span class="pin">🔻</span></div>`); wrap.appendChild(wheel);
  const right = el(`<div class="col grow" style="gap:12px"></div>`); wrap.appendChild(right);
  let rot = 0, segs = [];
  const cols = ['#ff9bd2', '#c3aeff', '#9be0ff', '#8ff5d2', '#ffe27a', '#ffb3dc', '#b5e6ff', '#d6c8ff'];
  const build = () => {
    segs = nums(8); let p = '';
    segs.forEach((v, i) => {
      const a0 = (i * 45 - 90) * Math.PI / 180, a1 = ((i + 1) * 45 - 90) * Math.PI / 180, m = i * 45 + 22.5;
      p += `<path d="M100 100 L${100 + 95 * Math.cos(a0)} ${100 + 95 * Math.sin(a0)} A95 95 0 0 1 ${100 + 95 * Math.cos(a1)} ${100 + 95 * Math.sin(a1)} Z" fill="${cols[i]}" stroke="#fff" stroke-width="2"/>
      <text transform="rotate(${m} 100 100) translate(100 ${100 - 62}) rotate(90)" text-anchor="middle" dominant-baseline="middle" font-size="${v >= 10000 ? 13 : 15}" font-weight="800" fill="#3a2770" font-family="Baloo 2,sans-serif">${fmt(v)}</text>`;
    });
    const old = $('svg', wheel); old && old.remove();
    wheel.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 200 200" style="transform:rotate(${rot}deg)"><circle cx="100" cy="100" r="98" fill="#fff"/>${p}<circle cx="100" cy="100" r="16" fill="#ffd84d" stroke="#fff" stroke-width="4"/></svg>`);
  };
  const ready = () => {
    right.innerHTML = `<div class="inst" style="font-size:36px">Spin the wheel! 🎡<span class="ko">룰렛을 돌리고 나온 숫자를 읽어요</span></div>`;
    const b = el(`<button class="btn big">🎡 SPIN!</button>`); right.appendChild(b);
    b.onclick = () => {
      b.disabled = true; const k = rnd(0, 7); const curMod = ((rot % 360) + 360) % 360;
      rot += 360 * 4 + ((360 - (k * 45 + 22.5)) - curMod + 360) % 360; $('svg', wheel).style.transform = `rotate(${rot}deg)`;
      for (let i = 0; i < 14; i++) setTimeout(() => tone(900 + i * 20, .03, 'square', .05), i * i * 14);
      c.later(() => ask(segs[k]), 3300);
    };
  };
  const ask = n => {
    SFX.sparkle(); burst(wheel, 12);
    right.innerHTML = `<div class="bignum" style="font-size:100px">${numHTML(n)}</div><div class="inst" style="margin:0">Read it!<span class="ko">어떻게 읽을까요?</span></div>`;
    const ch = el(`<div class="choices"></div>`); right.appendChild(ch); let lock = false;
    const win = b => { lock = true; good(b); speak(W(n)); if (!c.step()) c.later(() => { build(); ready(); }, 2000); };
    shuffle([n, ...similar(n, 2)]).forEach(v => { const b = el(`<button class="ch wd" style="font-size:20px">${WU(v)}</button>`); b.onclick = () => { if (lock) return; if (v === n) { b.classList.add('ok'); win(b); } else { b.classList.add('no'); c.no(b, n); } }; ch.appendChild(b); });
    const sp = el(`<button class="btn mint sm">🎙️ SAY IT</button>`); sp.onclick = () => sayIt(n, ok => ok && !lock && win(sp)); right.appendChild(sp);
  };
  build(); ready();
}

/* 12. MEMORY CARDS */
function gMemory(c) {
  const a = c.area; a.classList.add('panel');
  a.innerHTML = `<div class="inst" style="margin:0">Find the pairs! 🃏<span class="ko">숫자 카드와 영어 카드의 짝을 찾아요</span></div>`;
  const g = el(`<div class="mem"></div>`); a.appendChild(g);
  const ns = nums(4); const cards = shuffle([...ns.map(v => ({ v, t: 'n' })), ...ns.map(v => ({ v, t: 'w' }))]);
  let open = [], busy = false;
  cards.forEach(cd => {
    const d = el(`<div class="mc"><div class="in"><div class="fa">❔</div><div class="ba ${cd.t === 'w' ? 'wd' : ''}">${cd.t === 'n' ? fmt(cd.v) : WU(cd.v)}</div></div></div>`); d.cd = cd;
    d.onclick = () => {
      if (busy || d.classList.contains('f')) return; SFX.pop(); d.classList.add('f'); speak(W(cd.v)); open.push(d);
      if (open.length === 2) {
        busy = true; const [x, y] = open;
        if (x.cd.v === y.cd.v) { c.later(() => { x.classList.add('m'); y.classList.add('m'); good(y, 1, true); open = []; busy = false; c.step(); }, 700); }
        else { if (open.length) c.miss += .5; c.later(() => { SFX.bad(); x.classList.remove('f'); y.classList.remove('f'); open = []; busy = false; }, 1400); }
      }
    };
    g.appendChild(d);
  });
}

/* 13. NUMBER SORTING */
function gSort(c) {
  const a = c.area; a.classList.add('panel');
  const round = () => {
    const ns = shuffle(c.round === 0 ? [700, 7000, 5080, 5800, 1000] : nums(5)), sorted = [...ns].sort((x, y) => x - y);
    let k = 0;
    a.innerHTML = `<div class="inst">Smallest to biggest! 📶<span class="ko">가장 작은 수부터 차례로 눌러요</span></div>`;
    const top = el(`<div class="row" style="gap:16px"></div>`); a.appendChild(top);
    const steps = el(`<div class="row" style="align-items:flex-end;gap:10px;margin-top:30px;flex:1">${sorted.map((_, i) => `<div class="slot" style="height:${70 + i * 30}px;min-width:150px;align-items:flex-start;padding-top:8px"></div>`).join('')}</div>`); a.appendChild(steps);
    ns.forEach(v => {
      const b = el(`<button class="ch" style="font-size:40px;min-width:160px">${fmt(v)}</button>`);
      b.onclick = () => {
        if (v === sorted[k]) { const s = $$('.slot', steps)[k]; s.textContent = fmt(v); s.classList.add('fill'); b.style.visibility = 'hidden'; SFX.bounce(); speak(W(v)); k++; if (k === 5) { good(steps); c.later(() => speak(sorted.map(W).join(', ')), 800); if (!c.step()) c.later(round, 6500); } }
        else { c.no(b, null); speak(`Find the smallest number!`); }
      };
      top.appendChild(b);
    });
  };
  round();
}

/* 14. SHOPPING BASKET — hear a price, drag the item into the basket */
function gBasket(c) {
  const a = c.area; a.classList.add('panel');
  const round = () => {
    const items = shuffle(ITEMS).slice(0, 6), ps = nums(6), ti = rnd(0, 5), n = ps[ti];
    const say = `Put the item for ${W(n)} in the basket!`;
    a.innerHTML = '';
    const bar = topBar(`<button class="btn big sky" id="h">🔊 LISTEN</button><span class="inst" style="margin:0">Drag it to the basket!<span class="ko">들리는 가격의 상품을 바구니로 끌어 와요</span></span>`); a.appendChild(bar);
    $('#h', bar).onclick = () => speak(say);
    const row = el(`<div class="row grow" style="gap:30px;flex-wrap:nowrap"></div>`); a.appendChild(row);
    const g = el(`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;flex:1"></div>`); row.appendChild(g);
    const basket = el(`<div class="basket">🧺</div>`); row.appendChild(basket);
    items.forEach((it, k) => {
      const d = el(`<div class="prod" style="background:#fff;border-radius:24px;box-shadow:0 6px 0 #e3d4ff;padding:10px;cursor:grab"><span class="pe">${it.e}</span><span class="tag">${fmt(ps[k])}</span></div>`); g.appendChild(d);
      draggable(d, {
        targets: () => [basket],
        onDrop: (node, hit, moved) => {
          if (!hit && moved) return false;
          if (k === ti) { node.dataset.lock = 1; node.style.visibility = 'hidden'; basket.textContent = '🧺' + it.e; SFX.register(); good(basket); speak(`Yes! The ${it.n}. ${W(n)}.`); if (!c.step()) c.later(round, 2200); return true; }
          c.no(node, null); speak(`That's ${W(ps[k])}. We need ${W(n)}.`); return false;
        }
      });
    });
    c.later(() => speak(say), 400);
  };
  round();
}

/* 15. BOSS BATTLE */
function gBoss(c) {
  const a = c.area; a.classList.add('panel');
  const boss = pick(['👾', '👹', '🦑', '🐙', '🦖']), friend = pick(['🐣', '🦄', '🐰', '🐬', '🐥', '🐼', '🦋', '🐹']);
  let hp = c.total; c.endDelay = 5200;
  a.innerHTML = '';
  const top = el(`<div class="row" style="gap:30px;flex-wrap:nowrap"><div class="col"><div class="monster">${boss}</div><div class="hp"></div></div><div class="bubble" id="bb" style="max-width:420px">GRRR! I am the NUMBER MONSTER!<span class="ko">숫자 문제를 맞혀서 몬스터를 변신시켜요!</span></div></div>`); a.appendChild(top);
  const host = el(`<div class="col grow" style="justify-content:center"></div>`); a.appendChild(host);
  const mon = $('.monster', top), hpEl = $('.hp', top);
  const drawHP = () => hpEl.innerHTML = Array.from({ length: c.total }, (_, i) => i < hp ? '💜' : '🤍').join('');
  drawHP(); SFX.boss(); speak('Grrr! I am the number monster!');
  const types = ['listen', 'read', 'word', 'missing', 'listen', 'read'];
  const next = () => {
    askQ(host, makeQ(types[c.total - hp]), b => {
      good(b, 2, true); hp--; drawHP(); mon.classList.remove('hit'); void mon.offsetWidth; mon.classList.add('hit'); burst(mon, 16, ['💥', '⭐', '✨']);
      $('#bb', top).innerHTML = hp ? pick(['Ouch!', 'Oh no!', 'Wow, you are good!']) : '...';
      c.step();
      if (hp > 0) c.later(next, 2000);
      else c.later(() => {
        host.innerHTML = ''; SFX.level(); burst(mon, 50, ['✨', '💖', '🌟', '🌈']);
        mon.animate([{ transform: 'scale(1) rotate(0)' }, { transform: 'scale(.1) rotate(720deg)', filter: 'brightness(3)' }, { transform: 'scale(1.2) rotate(720deg)' }, { transform: 'scale(1)' }], { duration: 1600 });
        setTimeout(() => { mon.textContent = friend; mon.style.filter = 'drop-shadow(0 0 30px #ffe680)'; }, 800);
        $('#bb', top).innerHTML = `Thank you! I'm your friend now! 💖<span class="ko">몬스터가 귀여운 친구가 되었어요!</span>`;
        speak("Thank you! I'm your friend now!");
        if (!S.creatures.includes(friend)) { S.creatures.push(friend); save(); }
      }, 1200);
    }, () => { mon.classList.remove('laugh'); void mon.offsetWidth; mon.classList.add('laugh'); SFX.boss(); $('#bb', top).innerHTML = `Ha ha! Listen again!<span class="ko">괜찮아요! 정답을 듣고 다시!</span>`; });
  };
  c.later(next, 1800);
}

/* =========================================================
   boot
   ========================================================= */
(function boot() {
  const bg = $('#bg');
  ['⭐', '✨', '🌟', '💫', '✦'].forEach((s, k) => { for (let i = 0; i < 4; i++) bg.appendChild(el(`<span class="tw" style="left:${rnd(2, 96)}%;top:${rnd(2, 94)}%;animation-delay:-${rnd(0, 30) / 10}s;font-size:${rnd(14, 28)}px">${s}</span>`)); });
  misReset(); save();
  document.body.classList.toggle('calm', S.calm);
  go('map');
  // first-touch splash: unlocks audio + speech on iPad
  modal(`<div class="numiHost" data-size="170" style="display:inline-block">${numiFull(170)}</div>
   <h3 style="font-size:46px;background:linear-gradient(90deg,#ff5fae,#a079ff,#3fb8ff);-webkit-background-clip:text;background-clip:text;color:transparent">SUPER NUMBER WORLD!</h3>
   <div class="inst">Hi, I'm NUMI! 👋<span class="ko">소리를 켜고 시작해요 🔊 (태블릿은 가로로!)</span></div>
   <button class="btn big mint" data-close style="font-size:40px">▶ START!</button>`, () => { ac(); SFX.level(); loadVoices(); speak("Hi! I'm Numi! Let's go!"); });
})();
